<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>File Tree → Terminal Command Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=BBH+Bogle&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>

  <main class="container">
    <header class="hero">
      <span class="badge">Dev Utility</span>
      <h1>
        File Tree <span class="arrow">→</span> Terminal
      </h1>
      <p class="subhead">
        Paste a directory layout · instantly generate <strong>PowerShell</strong> and <strong>Bash</strong> setup scripts.
      </p>
    </header>

    <section class="input-section">
      <div class="label-row">
        <label for="treeInput">Paste File Structure</label>
        <span class="hint">Ctrl + Enter to generate</span>
      </div>
      <textarea
        id="treeInput"
        spellcheck="false"
        autocomplete="off"
        placeholder="my-project/
├── src/
│   ├── index.js
│   └── styles.css
├── public/
│   └── index.html
└── README.md"
      ></textarea>
    </section>

    <button id="generateBtn" class="btn-generate" type="button">
      <span class="btn-glow"></span>
      <span class="btn-content">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
        <span>Generate Commands</span>
      </span>
    </button>

    <section class="output-section" aria-live="polite">
      <article class="code-card" data-lang="powershell">
        <header class="card-header">
          <div class="card-title">
            <span class="dot dot-ps" aria-hidden="true"></span>
            <h3>PowerShell <small>(Windows)</small></h3>
          </div>
          <button class="copy-btn" data-target="psCode" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="copy-label">Copy</span>
          </button>
        </header>
        <pre id="psCode" class="code-block" tabindex="0"># Click generate to see PowerShell script...</pre>
      </article>

      <article class="code-card" data-lang="bash">
        <header class="card-header">
          <div class="card-title">
            <span class="dot dot-bash" aria-hidden="true"></span>
            <h3>Bash <small>(Linux / macOS)</small></h3>
          </div>
          <button class="copy-btn" data-target="bashCode" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span class="copy-label">Copy</span>
          </button>
        </header>
        <pre id="bashCode" class="code-block" tabindex="0"># Click generate to see Bash script...</pre>
      </article>
    </section>
  </main>

  <script src="cyberpunk-bg.js" defer></script>

  <script src="script.js" defer></script>
</body>
</html>
